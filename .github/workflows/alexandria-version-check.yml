name: Alexandria Version Check

# Run daily at 9 AM UTC to catch new Alexandria releases
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check Alexandria version
        id: version-check
        run: |
          npm run check-alexandria-version || echo "CHECK_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Create Issue if Update Needed
        if: env.CHECK_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('fs');
            const packageJson = JSON.parse(readFileSync('package.json', 'utf-8'));
            const currentVersion = packageJson.dependencies['alexandria-worker'].replace('^', '');

            // Check if issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'alexandria-update'
            });

            if (issues.length > 0) {
              console.log('Issue already exists for Alexandria update');
              return;
            }

            // Fetch latest version
            const response = await fetch('https://registry.npmjs.org/alexandria-worker/latest');
            const data = await response.json();
            const latestVersion = data.version;

            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Alexandria Update Available: v${currentVersion} → v${latestVersion}`,
              body: `## 🔄 Alexandria Version Update Detected

**Current:** \`alexandria-worker@${currentVersion}\`
**Latest:** \`alexandria-worker@${latestVersion}\`

### Action Items

- [ ] Review [Alexandria CHANGELOG](https://www.npmjs.com/package/alexandria-worker)
- [ ] Check for new API fields (author metadata, cover sizes, etc.)
- [ ] Update BendV3 API to expose new Alexandria fields if available
- [ ] Update \`src/api-v3/index.ts\` to pass through new data
- [ ] Update \`packages/schemas/src/book.ts\` with new schemas
- [ ] Regenerate OpenAPI spec: \`npm run generate:openapi\`
- [ ] Update contract tests: \`tests/integration/alexandria-contract.test.ts\`
- [ ] Run tests: \`npm run test:safe\`
- [ ] Bump version and publish npm package: \`@jukasdrj/bookstrack-api-client\`
- [ ] Deploy to production: \`npm run deploy\`

### Update Command

\`\`\`bash
npm install alexandria-worker@${latestVersion}
\`\`\`

---
**Auto-generated by:** [Alexandria Version Check workflow](.github/workflows/alexandria-version-check.yml)
              `,
              labels: ['alexandria-update', 'dependencies', 'enhancement']
            });

            console.log('Created issue for Alexandria update');

      - name: Comment on PR if Update Needed
        if: env.CHECK_FAILED == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **Alexandria Update Available**

This PR modifies \`package.json\` but Alexandria has a newer version available.

Run \`npm run check-alexandria-version\` for details.
              `
            });
