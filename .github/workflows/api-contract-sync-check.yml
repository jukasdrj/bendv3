name: API Contract Sync Check

on:
  pull_request:
    paths:
      - 'docs/API_CONTRACT.md'
      - 'docs/openapi.yaml'
      - 'src/types/websocket-messages.ts'
      - 'src/types/responses.ts'
  push:
    branches:
      - main
    paths:
      - 'docs/API_CONTRACT.md'
      - 'docs/openapi.yaml'
      - 'src/types/websocket-messages.ts'
      - 'src/types/responses.ts'

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check API Contract vs OpenAPI Sync
        run: |
          echo "🔍 Checking if API_CONTRACT.md and openapi.yaml are in sync..."

          # Extract version from API_CONTRACT.md
          CONTRACT_VERSION=$(grep -m 1 "^# BooksTrack API Contract" docs/API_CONTRACT.md | grep -oP 'v\d+\.\d+(\.\d+)?')
          echo "API Contract Version: $CONTRACT_VERSION"

          # Extract version from openapi.yaml
          OPENAPI_VERSION=$(grep -m 1 "version:" docs/openapi.yaml | grep -oP '\d+\.\d+(\.\d+)?')
          echo "OpenAPI Version: $OPENAPI_VERSION"

          # Check if versions match
          if [ "$CONTRACT_VERSION" != "v$OPENAPI_VERSION" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "  API_CONTRACT.md: $CONTRACT_VERSION"
            echo "  openapi.yaml: v$OPENAPI_VERSION"
            echo ""
            echo "Please update both files to the same version when making changes."
            exit 1
          fi

          # Check if both files were modified together
          if git diff --name-only HEAD~1 | grep -q "docs/API_CONTRACT.md"; then
            if ! git diff --name-only HEAD~1 | grep -q "docs/openapi.yaml"; then
              echo "⚠️  WARNING: API_CONTRACT.md was modified without updating openapi.yaml"
              echo "Please ensure both are kept in sync."
              echo ""
              echo "If this is intentional (e.g., only updating examples), add a comment to the commit."
            fi
          fi

          if git diff --name-only HEAD~1 | grep -q "docs/openapi.yaml"; then
            if ! git diff --name-only HEAD~1 | grep -q "docs/API_CONTRACT.md"; then
              echo "⚠️  WARNING: openapi.yaml was modified without updating API_CONTRACT.md"
              echo "Please ensure both are kept in sync."
            fi
          fi

          echo "✅ Version check passed"

      - name: Check TypeScript Types Sync
        run: |
          echo "🔍 Checking if TypeScript types match API contract..."

          # Check if job_complete schema exists in both
          if grep -q "JobCompletePayload" docs/API_CONTRACT.md; then
            if ! grep -q "JobCompletePayload" src/types/websocket-messages.ts; then
              echo "❌ ERROR: JobCompletePayload missing in TypeScript types"
              exit 1
            fi
          fi

          # Check if summary-only format is documented
          if grep -q "summary-only" docs/API_CONTRACT.md; then
            if ! grep -q "JobCompletionSummary" docs/openapi.yaml; then
              echo "❌ ERROR: OpenAPI spec missing JobCompletionSummary (summary-only format)"
              echo "API Contract mentions summary-only but OpenAPI doesn't have the schema."
              exit 1
            fi

            if ! grep -q "JobCompletionSummary" src/types/websocket-messages.ts; then
              echo "❌ ERROR: TypeScript types missing JobCompletionSummary"
              exit 1
            fi
          fi

          echo "✅ TypeScript types sync check passed"

      - name: Check expiresAt Field Consistency
        run: |
          echo "🔍 Checking expiresAt field consistency..."

          # Check if expiresAt is in all completion payloads
          HAS_EXPIRES_AT_CONTRACT=$(grep -c "expiresAt" docs/API_CONTRACT.md || echo "0")
          HAS_EXPIRES_AT_OPENAPI=$(grep -c "expiresAt" docs/openapi.yaml || echo "0")
          HAS_EXPIRES_AT_TS=$(grep -c "expiresAt" src/types/websocket-messages.ts || echo "0")

          echo "expiresAt mentions: CONTRACT=$HAS_EXPIRES_AT_CONTRACT, OPENAPI=$HAS_EXPIRES_AT_OPENAPI, TS=$HAS_EXPIRES_AT_TS"

          if [ "$HAS_EXPIRES_AT_CONTRACT" -gt "0" ] && [ "$HAS_EXPIRES_AT_OPENAPI" -eq "0" ]; then
            echo "❌ ERROR: expiresAt documented in contract but missing in OpenAPI"
            exit 1
          fi

          if [ "$HAS_EXPIRES_AT_CONTRACT" -gt "0" ] && [ "$HAS_EXPIRES_AT_TS" -eq "0" ]; then
            echo "❌ ERROR: expiresAt documented in contract but missing in TypeScript"
            exit 1
          fi

          echo "✅ expiresAt consistency check passed"

      - name: Final Summary
        if: success()
        run: |
          echo ""
          echo "✅ All API contract sync checks passed!"
          echo ""
          echo "Verified:"
          echo "  ✓ API_CONTRACT.md and openapi.yaml versions match"
          echo "  ✓ TypeScript types align with contract"
          echo "  ✓ Field consistency across all documents"
