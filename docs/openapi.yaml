                          - isbndb
                          - kv_cache
                          - d1_database
                          - vectorize
                    required:
                      - timestamp
                    additionalProperties: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - NOT_FOUND
                          - INVALID_REQUEST
                          - INVALID_ISBN
                          - INVALID_QUERY
                          - MISSING_PARAMETER
                          - UNAUTHORIZED
                          - FORBIDDEN
                          - INTERNAL_ERROR
                          - API_ERROR
                          - NETWORK_ERROR
                          - RATE_LIMIT_EXCEEDED
                          - CIRCUIT_OPEN
                          - PROVIDER_ERROR
                          - TIMEOUT
                      message:
