  /api/v2/capabilities:
    get:
      tags:
        - Discovery
      summary: Get API capabilities and feature availability
      description: |-

        Returns comprehensive feature availability and configuration.
        Clients should call this on app startup to discover available features.

        **Use Cases:**
        - Feature discovery (check which endpoints are available)
        - Version compatibility (check API version)
        - Rate limit awareness (know limits before hitting them)
        - Deprecation notices (prepare for sunset endpoints)
          
      responses:
        '200':
          description: API capabilities retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                      features:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            enabled:
                              type: boolean
                            version:
                              type: string
                            endpoints:
                              type: array
                              items:
                                type: string
                            rateLimit:
                              type: object
                              properties:
                                requests:
                                  type: integer
                                  minimum: 0
                                  exclusiveMinimum: true
                                windowMs:
                                  type: integer
                                  minimum: 0
                                  exclusiveMinimum: true
                              required:
                                - requests
                                - windowMs
                            notes:
                              type: string
                          required:
                            - name
                            - enabled
                            - version
                            - endpoints
                      limits:
                        type: object
                        properties:
                          maxBatchSize:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                          maxCsvRows:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                          maxImageSizeMb:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                          maxConcurrentJobs:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                        required:
                          - maxBatchSize
                          - maxCsvRows
                          - maxImageSizeMb
                          - maxConcurrentJobs
                      deprecations:
                        type: array
