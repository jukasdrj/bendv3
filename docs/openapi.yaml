openapi: 3.1.0
info:
  title: BooksTrack API
  version: 4.0.0
  description: |
    Book search, enrichment, and AI-powered scanning API.

    ## API Versioning

    **Current Version:** V2 API (recommended for all new integrations)

    **Legacy APIs:** V1 and unversioned endpoints are deprecated and will be removed March 1, 2026.

    ## Migration Guide

    | Legacy Endpoint | V2 Replacement | Notes |
    |-----------------|----------------|-------|
    | `GET /search/*` | `GET /api/v2/search` | Unified search with modes |
    | `POST /api/import/csv-gemini` | `POST /api/v2/imports` | Unified import workflow |
    | `GET /v1/csv/status/:id` | `GET /api/v2/imports/:id` | Job status polling |
    | `GET /v1/csv/results/:id` | `GET /api/v2/imports/:id/results` | Job results |
    | `POST /api/batch-enrich` | `POST /api/v2/books/enrich` | Single book enrichment |
    | `GET /ws/progress` | `GET /api/v2/imports/:id/stream` | SSE replaces WebSocket |

    ## Response Format

    All V2 endpoints use the unified ResponseEnvelope format:
    ```json
    {
      "data": { ... },
      "metadata": {
        "timestamp": "2025-12-01T00:00:00Z",
        "source": "google_books",
        "cached": true
      },
      "error": null  // or error object on failure
    }
    ```
  contact:
    email: api-support@oooefam.net
servers:
  - url: https://api.oooefam.net
    description: Production
  - url: http://localhost:8787
    description: Local development
tags:
  - name: V2 Search
    description: |
      **CURRENT** - Unified search API supporting text, semantic, and hybrid modes.
      Use these endpoints for all new integrations.
  - name: V2 Imports
    description: |
      **CURRENT** - CSV import and bookshelf scanning workflow.
      Supports SSE streaming for real-time progress updates.
  - name: V2 Enrichment
    description: |
      **CURRENT** - Book metadata enrichment from multiple providers.
      Includes optional vector embedding generation.
  - name: V2 Discovery
    description: |
      **CURRENT** - Trending content and personalized recommendations.
  - name: V1 Jobs
    description: |
      **LEGACY** - Job management endpoints. Use V2 Imports endpoints instead.
      Sunset: March 1, 2026
  - name: V1 Search
    description: |
      **DEPRECATED** - Legacy search endpoints. Use `/api/v2/search` instead.
      Sunset: March 1, 2026
  - name: Health
    description: System health and monitoring
components:
  schemas:
    # =========================================================================
    # RESPONSE ENVELOPE SCHEMAS
    # =========================================================================

    ResponseMetadata:
      type: object
      description: Standard metadata included in all responses
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of response
        source:
          type: string
          enum: [google_books, open_library, isbndb, kv-cache, d1-database, vectorize, text-search, job-state-manager-do, curated, none]
          description: Data source provider
        cached:
          type: boolean
          description: Whether response was served from cache
        processingTime:
          type: integer
          minimum: 0
          description: Processing time in milliseconds
      required:
        - timestamp

    ErrorResponse:
      type: object
      description: Standard error response envelope
      properties:
        data:
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
                - INVALID_REQUEST
                - INVALID_ISBN
                - INVALID_QUERY
                - MISSING_PARAMETER
                - UNAUTHORIZED
                - FORBIDDEN
                - INTERNAL_ERROR
                - API_ERROR
                - NETWORK_ERROR
                - RATE_LIMIT_EXCEEDED
                - CIRCUIT_OPEN
                - PROVIDER_ERROR
                - TIMEOUT
                - FEATURE_NOT_AVAILABLE
                - FILE_TOO_LARGE
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              additionalProperties: true
              description: Additional error context
            retryable:
              type: boolean
              description: Whether the request can be retried
            retryAfterMs:
              type: integer
              minimum: 0
              description: Milliseconds to wait before retry
            provider:
              type: string
              description: Provider that caused the error
          required:
            - code
            - message
      required:
        - data
        - error

    # =========================================================================
    # BOOK SCHEMAS
    # =========================================================================

    BookSearchResult:
      type: object
      description: Book result from search
      properties:
        isbn:
          type: string
          description: Primary ISBN (ISBN-13 preferred)
        isbn13:
          type: string
          pattern: '^\d{13}$'
        isbn10:
          type: string
          pattern: '^\d{10}$'
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        publisher:
          type: string
        publishedDate:
          type: string
        description:
          type: string
        pageCount:
          type: integer
          minimum: 0
        categories:
          type: array
          items:
            type: string
        coverUrl:
          type: string
          format: uri
        language:
          type: string
        openLibraryWorkId:
          type: string
          description: OpenLibrary work ID for edition grouping
      required:
        - title
        - authors

    EnrichedBook:
      type: object
      description: Fully enriched book with provider metadata
      properties:
        isbn:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        publisher:
          type: string
        publishedDate:
          type: string
        description:
          type: string
        pageCount:
          type: integer
          minimum: 0
        categories:
          type: array
          items:
            type: string
        coverUrl:
          type: string
          format: uri
        provider:
          type: string
          enum: [google_books, open_library, isbndb, orchestrated, kv-cache]
          description: Primary data provider
        enrichedAt:
          type: string
          format: date-time
        vectorized:
          type: boolean
          description: Whether embedding was generated for semantic search
      required:
        - isbn
        - title
        - authors
        - provider
        - enrichedAt
        - vectorized

    # =========================================================================
    # JOB SCHEMAS
    # =========================================================================

    JobState:
      type: object
      description: Current state of an async job
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [initialized, processing, completed, failed, canceled]
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Progress from 0.0 to 1.0
        processedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        pipeline:
          type: string
          enum: [csv_import, batch_enrichment, ai_scan]
        startTime:
          type: string
          format: date-time
        lastUpdateTime:
          type: string
          format: date-time
        completedTime:
          type: string
          format: date-time
        failedTime:
          type: string
          format: date-time
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
        canceled:
          type: boolean
        cancelReason:
          type: string
        canceledTime:
          type: string
          format: date-time
      required:
        - jobId
        - status
        - progress
        - processedCount
        - totalCount
        - pipeline

    JobResults:
      type: object
      description: Results from a completed import job
      properties:
        booksCreated:
          type: integer
          minimum: 0
        booksUpdated:
          type: integer
          minimum: 0
        duplicatesSkipped:
          type: integer
          minimum: 0
        enrichmentSucceeded:
          type: integer
          minimum: 0
        enrichmentFailed:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                description: Row number in CSV (if applicable)
              isbn:
                type: string
              error:
                type: string
        books:
          type: array
          description: Full canonical book objects for iOS persistence
          items:
            $ref: '#/components/schemas/BookSearchResult'
      required:
        - booksCreated
        - books

  parameters: {}
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: |-

        Simple health check that returns worker status.

        Returns basic worker information for monitoring purposes:
        - **status**: Health status indicator (always "ok" when responding)
        - **worker**: Worker service name
        - **version**: API version
        - **router**: Router framework type

        **Example:** `GET /health`

        This endpoint is publicly accessible and requires no authentication.
        Use it for:
        - Monitoring and uptime checks
        - Load balancer health gates
        - CI/CD pipeline verification
          
      responses:
        '200':
          description: Health check successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                        description: Health status indicator
                      worker:
                        type: string
                        description: Worker service name
                      version:
                        type: string
                        description: API version
                      router:
                        type: string
                        enum:
                          - hono
                        description: Router framework
                    required:
                      - status
                      - worker
                      - version
                      - router
                    additionalProperties: false
                  metadata:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp
                    required:
                      - timestamp
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
              example:
                data:
                  status: ok
                  worker: api-worker
                  version: 2.1.0
                  router: hono
                metadata:
                  timestamp: '2025-11-28T12:00:00.000Z'
  /v1/search/isbn:
    get:
      tags:
        - V1 Search
      summary: Search for a book by ISBN
      deprecated: true
      x-sunset: "2026-03-01"
      description: >-

        **DEPRECATED:** Use `POST /api/v2/books/enrich` instead. Sunset: March 1, 2026.

        ---

        Search for a book by ISBN-10 or ISBN-13 (digits only, no hyphens).


        Returns comprehensive book data including:

        - Works: Abstract creative works (title, description, subjects)

        - Editions: Physical/digital editions (publisher, publication date,
        format)

        - Authors: Author biographical data (name, gender, cultural region)


        **Example:** `GET /v1/search/isbn?isbn=9780439708180`


        **Multi-Provider Orchestration:**

        1. BookRepository (KV/D1 cache) - fastest

        2. Google Books API - primary source

        3. OpenLibrary API - fallback #1

        4. ISBNdb API - fallback #2


        **Cache TTL:** 24 hours (KV), permanent (D1)


        **Rate Limits:**

        - 100 requests/minute per IP

        - 1000 requests/hour per IP


        **Circuit Breaker Protection:**

        All external providers are protected by circuit breakers.

        If a provider's circuit is OPEN, the request fails fast with
        `CIRCUIT_OPEN` error.
          
      parameters:
        - schema:
            type: string
            minLength: 10
            maxLength: 13
            pattern: ^\d{10}$|^\d{13}$
            description: ISBN-10 or ISBN-13 (digits only, no hyphens)
          required: true
          description: ISBN-10 or ISBN-13 (digits only, no hyphens)
